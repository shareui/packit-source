name: Build Kotlin dexes

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile Kotlin -> dex
    runs-on: ubuntu-latest
    env:
      KOTLIN_VERSION: "2.0.21"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Kotlin compiler
        run: |
          curl -sSL -o kotlin-compiler.zip \
            "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"
          unzip -q kotlin-compiler.zip -d "$HOME/kotlinc-dist"
          echo "$HOME/kotlinc-dist/kotlinc/bin" >> "$GITHUB_PATH"

      - name: Build dexes
        run: |
          chmod +x scripts/linux/kotlin-build.sh
          ./scripts/linux/kotlin-build.sh

      - name: Show result
        run: |
          git status --porcelain packit/dex/ || true
          ls -la packit/dex/ || true

      - name: Upload dex artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packit-dexes
          path: packit/dex/*.dex
          if-no-files-found: error
