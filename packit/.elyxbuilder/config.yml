zipFormat: eaf
source: packit/src
buildNameUncompiled: '{name}-{version}'
buildNameCompiled: '{name}-{version}-3.11'
ignoreAll:
- packit/.elyxbuilder/cache/*
- packit/docs/
compilationIgnore:
- packit/src/BasePlugin.py
obfuscationConfig:
  stripDocstrings: true
  removeLogs: false
  renameLocals: true
  encodeStrings: true
  encodeNumbers: true
  zlibCompression: false
  saveMapping: true
